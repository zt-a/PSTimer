# Production stack: `docker compose up --build -d`.
#
# All services start, migrate and seed automatically. No domain needed —
# open http://<SERVER-IP>/ (frontend on port 80, override with HTTP_PORT).
#
# Postgres is only reachable inside the compose network; the API is exposed
# on API_PORT (8000) for direct/debug access.
#
# Per-server overrides go into a root `.env` file (auto-loaded by Compose):
#   HTTP_PORT, API_PORT, POSTGRES_PASSWORD, ADMIN_USERNAME, ADMIN_PASSWORD,
#   JWT_SECRET, TELEGRAM_BOT_TOKEN, CORS_ORIGINS, CLUB_TIMEZONE, ...
# See .env.example for the full list.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pstimer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pstimer}
      POSTGRES_DB: pstimer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pstimer -d pstimer"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: pstimer-backend
    restart: unless-stopped
    env_file:
      - backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://pstimer:${POSTGRES_PASSWORD:-pstimer}@db:5432/pstimer
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      APP_NAME: ${APP_NAME:-PlayStation Club}
      CLUB_TIMEZONE: ${CLUB_TIMEZONE:-Asia/Bishkek}
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-30}
      CLEANUP_INTERVAL_HOURS: ${CLEANUP_INTERVAL_HOURS:-6}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - backendsecrets:/app/.secrets   # persisted JWT secret
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    container_name: pstimer-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"

  # Standalone retention worker: purges session history older than
  # HISTORY_RETENTION_DAYS (default 30). Keeps raw history to max 1 month.
  worker:
    build:
      context: ./backend
    container_name: pstimer-worker
    restart: unless-stopped
    env_file:
      - backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://pstimer:${POSTGRES_PASSWORD:-pstimer}@db:5432/pstimer
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-30}
      CLEANUP_INTERVAL_HOURS: ${CLEANUP_INTERVAL_HOURS:-6}
    volumes:
      - backendsecrets:/app/.secrets
    depends_on:
      backend:
        condition: service_healthy
    command: python -m app.worker

volumes:
  pgdata:
  backendsecrets: